apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulatory
  namespace: protean-prod
  labels:
    app: regulatory
    tier: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regulatory
  template:
    metadata:
      labels:
        app: regulatory
    spec:
      serviceAccountName: protean-api
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: regulatory
          image: protean-shapes:2.0.0-enterprise
          command: ["uvicorn", "app.regulatory.api:app", "--host", "0.0.0.0", "--port", "8082"]
          ports:
            - containerPort: 8082
          env:
            - name: ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-config
                  key: POSTGRES_URL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: protean-mtls-certs
---
apiVersion: v1
kind: Service
metadata:
  name: regulatory
  namespace: protean-prod
spec:
  selector:
    app: regulatory
  ports:
    - port: 8082
      targetPort: 8082

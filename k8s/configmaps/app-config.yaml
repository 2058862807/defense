apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: protean-prod
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  APP_NAME: "protean-defense"
  JWT_ALGORITHM: "RS256"
  JWT_AUD: "protean-api"
  JWT_ISSUER: "https://auth.protean.sh"
  FLASHBOTS_RELAY_URL: "https://relay.flashbots.net"
  PRIVATE_RPC_URL: "https://rpc.flashbots.net"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: licensing
  namespace: protean-prod
  labels:
    app: licensing
    tier: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: licensing
  template:
    metadata:
      labels:
        app: licensing
    spec:
      serviceAccountName: protean-licensing
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: licensing
          image: protean-licensing:2.0.0-enterprise
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: ENV
              value: "production"
            - name: LICENSE_PUBKEY_PATH
              value: "/app/licenses/licensing_pubkey.pem"
            - name: LICENSE_PATH
              value: "/app/licenses/enterprise.license.json"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-config
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: vault-config
                  key: VAULT_ADDR
                  optional: true
          volumeMounts:
            - name: licenses
              mountPath: /app/licenses
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: licenses
          secret:
            secretName: licensing-keys
        - name: certs
          secret:
            secretName: protean-mtls-certs
---
apiVersion: v1
kind: Service
metadata:
  name: licensing
  namespace: protean-prod
spec:
  selector:
    app: licensing
  ports:
    - port: 8085
      targetPort: 8085
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: protean-licensing
  namespace: protean-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: licensing-keys
  namespace: protean-prod
type: Opaque
data:
  licensing_pubkey.pem: ""
  enterprise.license.json: ""

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proteanbots.protean.sh
  labels:
    app: protean-operator
    compliance: FIPS-140-3
spec:
  group: protean.sh
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [type, replicas, policyVersion, circuitHash, modelHash]
              properties:
                type:
                  type: string
                  enum: [offense, defense]
                  description: Bot type
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: HA replicas - Gov requires 3 min
                policyVersion:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  description: Fairness policy version
                circuitHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: ^[a-f0-9]{64}$
                  description: SHA256 of WASM+ZKEY - SLSA provenance, no dev_ allowed in prod
                modelHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: SHA256 of model file
                image:
                  type: string
                  description: Enterprise image with cosign signature
                vaultRole:
                  type: string
                  default: protean-prod
                licenseSecret:
                  type: string
                  default: protean-license
            status:
              type: object
              properties:
                replicas:
                  type: integer
                policyVersion:
                  type: string
                circuitHash:
                  type: string
                modelHash:
                  type: string
                lastReconciled:
                  type: string
                  format: date-time
                compliance:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: proteanbots
    singular: proteanbot
    kind: ProteanBot
    shortNames:
      - pbot

apiVersion: v1
kind: Secret
metadata:
  name: vault-config
  namespace: protean-prod
type: Opaque
stringData:
  VAULT_ADDR: "https://vault.protean.sh"
  ROLE_ID: "protean-prod-role-id"
  # SECRET_ID should be injected via Vault Agent, not hardcoded

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-config
  namespace: protean-prod
type: Opaque
stringData:
  REDIS_URL: "rediss://redis:6380/0"
  REDIS_PASS: "change_me_in_production"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-config
  namespace: protean-prod
type: Opaque
stringData:
  POSTGRES_URL: "postgresql://protean:protean@postgres:5432/protean?sslmode=require"
  POSTGRES_PASS: "change_me_in_production"

---
apiVersion: v1
kind: Secret
metadata:
  name: protean-mtls-certs
  namespace: protean-prod
type: Opaque
data:
  # These would be base64 encoded certs from Vault Agent
  tls.crt: ""
  tls.key: ""
  ca.crt: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: protean-prod
type: Opaque
stringData:
  QRYPT_API_TOKEN: "change_me_qrypt_free_tier_1000_per_day"
  AZURE_SUBSCRIPTION_ID: "change_me_azure_10000_per_month"
  AWS_ACCESS_KEY_ID: "change_me_aws"
  AWS_SECRET_ACCESS_KEY: "change_me_aws_secret"
  AWS_CLOUDHSM_CLUSTER_ID: "change_me"
  GCP_PROJECT_ID: "change_me_gcp_10000_ops"
  SECUROSYS_AUTH_TOKEN: "change_me_securosys_1000_ops"

# Secret material is operator/Tier-1 supplied and injected at deploy time via
# Vault Agent / External Secrets Operator. Values here are deliberately EMPTY
# (fail-closed): an empty secret means the app refuses to start or serve until
# real credentials are injected. Never commit placeholder "credential" strings.
apiVersion: v1
kind: Secret
metadata:
  name: vault-config
  namespace: protean-prod
type: Opaque
stringData:
  VAULT_ADDR: "https://vault.protean.sh"
  ROLE_ID: "" # operator-supplied AppRole role id
  # SECRET_ID injected via Vault Agent, never stored in git.

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-config
  namespace: protean-prod
type: Opaque
stringData:
  REDIS_URL: "rediss://redis:6380/0"
  REDIS_PASS: "" # operator-supplied; empty => fail-closed (no default password)

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-config
  namespace: protean-prod
type: Opaque
stringData:
  POSTGRES_URL: "postgresql://protean:protean@postgres:5432/protean?sslmode=require"
  POSTGRES_PASS: "" # operator-supplied; empty => fail-closed

---
apiVersion: v1
kind: Secret
metadata:
  name: protean-mtls-certs
  namespace: protean-prod
type: Opaque
data:
  # base64-encoded certs injected from Vault Agent. Empty until provisioned.
  tls.crt: ""
  tls.key: ""
  ca.crt: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: protean-prod
type: Opaque
stringData:
  # All operator-supplied (Tier 1). Empty => HSM/QRNG services use their
  # documented fail-closed fallback paths rather than fake credentials.
  QRYPT_API_TOKEN: ""
  AZURE_SUBSCRIPTION_ID: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_CLOUDHSM_CLUSTER_ID: ""
  GCP_PROJECT_ID: ""
  SECUROSYS_AUTH_TOKEN: ""

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: protean-prod
  labels:
    app: api
    tier: microservice
    version: 2.0.0-enterprise
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
        tier: microservice
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "protean-prod"
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/data/prod/jwt"
        vault.hashicorp.com/agent-inject-secret-evm: "secret/data/prod/evm-signer"
    spec:
      serviceAccountName: protean-api
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: protean-shapes:2.0.0-enterprise
          imagePullPolicy: Always
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENV
                  optional: true
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: ZK_CIRCUIT_HASH
              valueFrom:
                configMapKeyRef:
                  name: circuit-config
                  key: CIRCUIT_HASH
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-config
                  key: POSTGRES_URL
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: QRYPT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-credentials
                  key: QRYPT_API_TOKEN
                  optional: true
          envFrom:
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: certs
          secret:
            secretName: protean-mtls-certs
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: protean-prod
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: protean-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: protean-api
  namespace: protean-prod

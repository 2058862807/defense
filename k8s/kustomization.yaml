apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: protean-prod

resources:
  - namespace/namespace.yaml
  - networkpolicy/networkpolicy.yaml
  - configmaps/app-config.yaml
  - secrets/secrets.yaml
  - postgres/postgres.yaml
  - redis/redis.yaml
  - kafka/kafka.yaml
  - cronjobs/compliance-update.yaml
  - operator/crd.yaml
  - operator/deployment.yaml
  - api/api.yaml
  - defense-bot/defense-bot.yaml
  # NOTE: no standalone zk-prover service. ZK proving runs in-process in the api
  # pod via CircuitIngestor (snarkjs + WASM + ZKEY). The old zk-prover manifest
  # (k8s/zk-prover/zk-prover.yaml) is DEPRECATED and not applied.
  - regulatory/regulatory.yaml
  - ml-scorer/ml-scorer.yaml
  - connector/connector.yaml
  - licensing/licensing.yaml
  - monitoring/monitoring.yaml

commonLabels:
  app: protean-defense
  version: 2.0.0-enterprise
  compliance: FIPS-140-3

images:
  - name: protean-shapes
    newName: protean-shapes
    newTag: 2.0.0-enterprise
  - name: protean-connector
    newName: protean-connector
    newTag: 2.0.0-enterprise
  - name: protean-licensing
    newName: protean-licensing
    newTag: 2.0.0-enterprise

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      # dev = local/JWKS-bypass mode (matches the supervisor-run stack).
      # Set ENV=production for fail-closed (requires real Vault/JWKS/RPC/Redis).
      ENV: ${ENV:-dev}
      PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      PYTHON_API_URL: http://backend:8080
      PYTHON_WS_URL: ws://backend:8080/ws
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

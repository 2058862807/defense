name: Enterprise Gov CI - SLSA L3

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build (React + gateway)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (vite + esbuild server bundle)
        run: npm run build

  secure-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write  # for cosign SLSA
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: No real signing keys committed
        run: |
          chmod +x scripts/check_no_secrets_staged.sh
          ./scripts/check_no_secrets_staged.sh --tracked

      - name: Setup Python 3.11 FIPS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install circom & snarkjs
        run: |
          npm install -g snarkjs@0.7.4
          curl -L https://github.com/iden3/circom/releases/download/v2.1.5/circom-linux-amd64 -o circom
          chmod +x circom && sudo mv circom /usr/local/bin/circom
          circom --version

      - name: Build liboqs (FIPS 203)
        env:
          LIBOQS_COMMIT: f4b96220e4bd208895172acc4fedb5a191d9f5b1
        run: |
          git clone https://github.com/open-quantum-safe/liboqs.git
          cd liboqs && git checkout "$LIBOQS_COMMIT"
          if [ "$(git rev-parse HEAD)" != "$LIBOQS_COMMIT" ]; then
            echo "FATAL: liboqs checkout does not match pinned commit $LIBOQS_COMMIT" >&2; exit 1
          fi
          mkdir build && cd build && cmake -DBUILD_SHARED_LIBS=ON .. && make -j4 && sudo make install && sudo ldconfig
          cd ../.. && git clone https://github.com/open-quantum-safe/liboqs-python.git && cd liboqs-python && pip install .

      - name: Verify committed circuit artifacts match pinned hashes
        run: |
          wasm_sha=$(sha256sum circuits/final_artifacts/fairness_policy.wasm | awk '{print $1}')
          zkey_sha=$(sha256sum circuits/final_artifacts/fairness_policy_final.zkey | awk '{print $1}')
          grep -q "$wasm_sha" circuits/final_artifacts/circuit.hash || { echo "wasm hash mismatch"; exit 1; }
          grep -q "$zkey_sha" circuits/final_artifacts/circuit.hash || { echo "zkey hash mismatch"; exit 1; }
          echo "Artifact integrity OK"

      - name: verify requirements.enterprise.txt matches requirements.in
        run: |
          pip install uv
          uv pip compile requirements.in -o /tmp/requirements.enterprise.txt.check --generate-hashes --python-version 3.11
          diff requirements.enterprise.txt /tmp/requirements.enterprise.txt.check

      - name: pip-audit strict
        run: |
          pip install pip-audit
          pip-audit -r requirements.enterprise.txt --strict

      - name: SAST - Bandit
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit.json

      - name: SBOM CycloneDX
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.enterprise.txt -o sbom.json

      - name: Train model with gov data (no random)
        run: |
          python -m app.ml.scorer
          cat models/commitment.json

      - name: Run unit tests (no mock)
        env:
          ENV: dev
          JWT_JWKS_URL: https://auth.dev.protean.sh/.well-known/jwks.json
          ZK_CIRCUIT_PATH_WASM: circuits/final_artifacts/fairness_policy.wasm
          ZK_CIRCUIT_PATH_ZKEY: circuits/final_artifacts/fairness_policy_final.zkey
          ZK_VERIFICATION_KEY_PATH: circuits/final_artifacts/verification_key.json
          ZK_CIRCUIT_HASH: d80e39879037cddf0694ee59d1b6d21d1a9fa386196564732a19245363100b41
          EVM_RPC_URL: https://mainnet.infura.io/v3/test
          EVM_WS_URL: wss://mainnet.infura.io/ws/v3/test
          VAULT_ADDR: https://vault.dev.protean.sh
          VAULT_ROLE_ID: test
          VAULT_SECRET_ID: test
          FAIRNESS_REGISTRY_ADDRESS: 0x0000000000000000000000000000000000000000
          FAIRNESS_VERIFIER_ADDRESS: 0x0000000000000000000000000000000000000000
        run: |
          pytest tests/unit -q -k "not custody"
          python tests/e2e/test_pipeline.py

      - name: Cosign sign artifacts
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign-blob --yes sbom.json --output-signature sbom.sig
          cosign sign-blob --yes circuits/final_artifacts/verification_key.json --output-signature circuit.sig

      - name: Build enterprise Docker (distroless)
        run: |
          docker build -f Dockerfile.enterprise -t protean-shapes:enterprise --provenance=true .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: protean-shapes:enterprise
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to Render (backend + frontend)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [secure-build, frontend-build]
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy backend
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy frontend
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

      - name: Warn if deploy hooks not configured
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK == '' && secrets.RENDER_FRONTEND_DEPLOY_HOOK == '' }}
        run: |
          echo "::warning::No RENDER_BACKEND_DEPLOY_HOOK / RENDER_FRONTEND_DEPLOY_HOOK secrets set - skipping Render deploy. Add the Render deploy hook URLs as secrets to enable auto-deploy."
